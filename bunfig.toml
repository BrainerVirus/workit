[install]
linker = "hoisted"
# Release-age gate off for this checkout: bun offers no per-package exclude,
# and exact pins + bun.lock already make installs deterministic. The gate only
# fires when a pin is deliberately moved to a fresh release. Machine-global
# `min-release-age` in ~/.npmrc still guards every other project.
minimumReleaseAge = 0

[test]
# Fail fast with one clear message when the PATH node is older than Node 24,
# remove run-scoped temp dirs (packed tarballs) once all files ran, and give
# the run its own Workit state dir so spawned processes never write the real one.
preload = [
  "./test/shared/node-guard.ts",
  "./test/shared/temp-cleanup.ts",
  "./test/shared/state-isolation.ts",
]
