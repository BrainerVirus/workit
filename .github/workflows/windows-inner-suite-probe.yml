name: Windows inner-suite probe

# AR-14 diagnostic (dispatch-only): reproduces the exact inner `bun test` run
# the AR-14 negative-fixture test performs (handoff + sdd + repo suites) on
# windows-latest, with FULL output so the real failing test name is visible —
# the AR-14 assertion truncates stderr to 2000 chars and hides it.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the AR-14 inner suites with full output
        run: bun test test/workit-core/handoff.test.ts test/workit-core/sdd.test.ts test/workit-core/repo.test.ts
