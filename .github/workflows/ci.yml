name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Declared support matrix (RR-10/PT-11): single source of truth for the pinned
# toolchain and host versions. test/artifacts/manifests.test.ts and
# test/artifacts/packed-runtime.test.ts assert these match
# packages/workit-core/src/core/support-matrix.ts.
env:
  BUN_VERSION: "1.3.14"
  NODE_MINIMUM: "20"
  NODE_CURRENT: "22"
  OPENCODE_MINIMUM: "1.15.0"
  OPENCODE_CURRENT: "1.17.7"

jobs:
  # One check job per package (mirrors test/<package>/), so the checks matrix
  # shows per-category results. workit-core gets the full 3-OS matrix because
  # it owns the bash script/portability tests (workspaces-scripts, install-scripts,
  # hygiene-verify, repo, youtrack); the thin packages run on ubuntu only.
  core:
    name: check (workit-core)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Test workit-core
        run: bun test test/workit-core

      - name: Typecheck (whole repo)
        run: bun run typecheck

  opencode:
    name: check (workit-opencode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Test workit-opencode
        run: bun test test/workit-opencode

      - name: Typecheck (whole repo)
        run: bun run typecheck

  cursor:
    name: check (workit-cursor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Test workit-cursor
        run: bun test test/workit-cursor

      - name: Typecheck (whole repo)
        run: bun run typecheck

  cli:
    name: check (workit-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Test workit-cli
        run: bun test test/workit-cli

      - name: Typecheck (whole repo)
        run: bun run typecheck

  shared:
    # test/shared/helpers has no standalone tests (helpers are exercised via the
    # importing packages' jobs); the job guards that the helpers still compile.
    name: check (shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck (whole repo)
        run: bun run typecheck

  # Phase 2 artifact matrix (CA-26): the packed-artifact, registration, and
  # manifest gates run on every declared OS × Node version combination. Node is
  # provided explicitly so the packed adapters are exercised on both the
  # declared minimum and current Node lines.
  artifacts:
    name: check (artifacts) ${{ matrix.os }} / node-${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Packed artifact, registration, and manifest gates
        run: bun test test/artifacts

  candidate:
    # Phase 0 release-candidate gate (RR-11 / CA-30): pack every workspace
    # package WITHOUT publishing and verify the corrective candidate installs
    # and starts in isolation. bun pm pack only writes a local tarball — no
    # registry, no tags, no marketplace operations.
    name: check (phase-0 candidate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Pack and gate the corrective candidate
        run: bun test test/artifacts/phase-0-candidate.test.ts
