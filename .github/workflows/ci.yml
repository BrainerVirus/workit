name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  # PRs: the newest push cancels the previous run. main: one group per commit,
  # never cancelled, so every merge gets its own CI-gated release attempt
  # (semantic-release skips a run whose commit is no longer the branch head).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Declared support matrix (RR-10/PT-11): single source of truth for the pinned
# toolchain and host versions. test/artifacts/manifests.test.ts and
# test/artifacts/packed-runtime.test.ts assert these match
# packages/workit-core/src/core/support-matrix.ts.
env:
  BUN_VERSION: "1.4.1"
  NODE_MINIMUM: "24"
  NODE_CURRENT: "24.20.0"
  OPENCODE_MINIMUM: "2.0.18"
  OPENCODE_CURRENT: "2.0.18"
  CLAUDE_CODE_VERSION: "2.1.288"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  ZIZMOR_VERSION: "1.30.1"

# Branch protection requires these check names: "fast checks",
# "test (ubuntu-latest)", "test (macos-latest)", "test (windows-latest)".
# A job skipped by a job-level `if` reports success, so a docs-only PR skips
# the test legs and still satisfies every required check.
jobs:
  # Docs-only PRs (docs/** outside docs/qualification/, which acceptance tests
  # read, or a root or .github/ *.md) skip the test legs. A push to main always
  # runs everything: the release gates on it. Fails open: a missing output
  # runs the tests.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # The PR merge commit and its first parent (the base tip).
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != pull_request ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both sides of a move, so moving code into
          # docs/ is never classified docs-only.
          files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          code=$(printf '%s\n' "$files" | grep -vE '^(docs/|[^/]+\.md$|\.github/[^/]+\.md$)' || true)
          qualification=$(printf '%s\n' "$files" | grep -E '^docs/qualification/' || true)
          if [[ -n "$files" && -z "$code" && -z "$qualification" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # Static gates that need no build: one install, all checks in parallel.
  fast:
    name: fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Install actionlint and zizmor
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$bin" actionlint
          pipx install --quiet "zizmor==${ZIZMOR_VERSION}"
          echo "$bin" >> "$GITHUB_PATH"

      # Each gate runs concurrently; logs are printed per gate afterwards so
      # failures stay readable.
      - name: Lint, format, knip, typecheck, react-doctor, actionlint, zizmor
        run: |
          set -uo pipefail
          names=(lint format knip typecheck react-doctor actionlint zizmor)
          cmds=(
            "bun run lint"
            "bun run format:check"
            "bun run knip"
            "bun run typecheck"
            "bun run doctor"
            "actionlint"
            "zizmor --offline --no-progress --config .github/zizmor.yml .github/workflows"
          )
          out="$RUNNER_TEMP/gates"
          mkdir -p "$out"
          for i in "${!names[@]}"; do
            (
              start=$(date +%s%N)
              # `|| rc=$?`: under `bash -e` a failing check would end this
              # subshell before its status file is written, hiding its log.
              rc=0
              bash -c "${cmds[$i]}" >"$out/${names[$i]}.log" 2>&1 || rc=$?
              echo "$rc $(( ($(date +%s%N) - start) / 1000000 ))" >"$out/${names[$i]}.status"
            ) &
          done
          wait
          failed=0
          for name in "${names[@]}"; do
            rc=1 ms=0
            [[ -f "$out/$name.status" ]] && read -r rc ms <"$out/$name.status"
            echo "::group::$name (exit $rc, ${ms} ms)"
            cat "$out/$name.log"
            echo "::endgroup::"
            if [[ "$rc" != 0 ]]; then
              echo "::error::$name failed"
              failed=1
            fi
          done
          exit "$failed"

  # Every test directory on Linux (unit + packaging tiers), so a new suite
  # cannot silently escape CI.
  test:
    name: test (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Shell/context tests resolve real revision ranges (HEAD~1, ranges), so
      # the checkout needs full history rather than the default shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The npm cache feeds the packaging suites' isolated npm installs
      # (tarballs; metadata still revalidates); keyed by bun.lock.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_CURRENT }}
          cache: npm
          cache-dependency-path: bun.lock

      - name: Restore bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      # CA-21: the tracked Marketplace artifact validates against the official
      # Cursor JSON schemas from a clean checkout, before any build output
      # exists.
      - name: Validate Cursor Marketplace artifact
        run: bun run validate:cursor-marketplace

      # The dev-checkout install tests install the adapters from this
      # checkout; dist/ and the vendored skills are build products
      # (gitignored), so the checkout must be built before testing.
      - name: Build packages
        run: bun run build

      # S14 PR gate: the real Claude Code CLI (pinned in the support matrix)
      # validates the built plugin and the root marketplace in strict mode.
      # No credential is needed; the packaging tier reuses this binary through
      # WORKIT_CLAUDE_BIN to validate and install the packed plugin.
      - name: Validate Claude Code plugin and marketplace
        run: | # zizmor: ignore[adhoc-packages] -- exact support-matrix pin
          set -euo pipefail
          # Exact version pinned in the support matrix (no lockfile for a CLI tool).
          npm install --no-save --prefix "$RUNNER_TEMP/claude" "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude="$RUNNER_TEMP/claude/node_modules/.bin/claude"
          export HOME="$RUNNER_TEMP/claude-home" CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-home/.claude"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          "$claude" --version
          "$claude" plugin validate --strict packages/workit-claude-code
          "$claude" plugin validate --strict .
          echo "WORKIT_CLAUDE_BIN=$claude" >> "$GITHUB_ENV"

      # Both tiers together cover every test directory (scripts/test.ts):
      # the unit tier excludes exactly the packaging suites.
      - name: Test (unit tier)
        run: bun run test

      - name: Test (packaging tier)
        run: bun run test:packaging

      # AR-01/CA-33: the same pack-only release-candidate gate release.yml
      # runs before publishing, so release breakage shows up pre-merge.
      - name: Verify release candidate
        run: bun run verify:release-candidate

  # workit-core owns the bash script/portability tests and the packed-artifact
  # gates (CA-26); both also run on macOS and Windows with the declared Node.
  # `bun scripts/test.ts shard` picks the files and the per-test timeouts.
  portability:
    name: test (macos-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The npm cache feeds the packaging suites' isolated npm installs
      # (tarballs; metadata still revalidates); keyed by bun.lock.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_CURRENT }}
          cache: npm
          cache-dependency-path: bun.lock

      - name: Restore bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Test workit-core and artifacts
        run: bun scripts/test.ts shard 1/1 test/workit-core test/artifacts

  # The Windows run of the same suite is the critical path (~13 min serial),
  # so it runs as three balanced shards; "test (windows-latest)" below
  # aggregates them under the required check name.
  windows-shard:
    name: windows shard ${{ matrix.shard }}/3
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The npm cache feeds the packaging suites' isolated npm installs
      # (tarballs; metadata still revalidates); keyed by bun.lock.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_CURRENT }}
          cache: npm
          cache-dependency-path: bun.lock

      - name: Restore bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Test workit-core and artifacts (shard ${{ matrix.shard }}/3)
        env:
          SHARD: ${{ matrix.shard }}
        run: bun scripts/test.ts shard "$env:SHARD/3" test/workit-core test/artifacts

  windows:
    name: test (windows-latest)
    needs: [changes, windows-shard]
    # Always runs, so a failed, timed-out or cancelled shard fails this
    # required check instead of skipping it (a skipped check counts as passing).
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every Windows shard
        env:
          SHARDS: ${{ needs.windows-shard.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          echo "windows shards: $SHARDS (docs_only=$DOCS_ONLY)"
          if [[ "$SHARDS" == success ]]; then exit 0; fi
          if [[ "$SHARDS" == skipped && "$DOCS_ONLY" == true ]]; then exit 0; fi
          exit 1

  # Release only after every gate passed for this exact commit on main.
  release:
    needs: [fast, test, portability, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # GitHub Release
      issues: write # semantic-release success comments
      pull-requests: write # semantic-release success comments, manifest sync PR
      id-token: write # npm provenance
    # `$/` self-repository syntax is not understood by actionlint 1.7.12 yet.
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]
    secrets:
      NPMJS: ${{ secrets.NPMJS }}
      RELEASE_SYNC_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
