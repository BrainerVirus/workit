name: OpenCode V2 harness

# Opt-in Docker suites against the pinned OpenCode V2 image
# (test/opencode-v2/{contract,lifecycle,matrix}.test.ts). They pull images and
# take minutes, so they run on demand or on an `opencode-v2` PR label, never as
# a required gate; without WORKIT_V2_HARNESS=1 the suites report as skipped.
on:
  pull_request:
    types: [labeled, synchronize]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: opencode-v2-harness-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.1"
  NODE_CURRENT: "24.20.0"

jobs:
  harness:
    name: opencode v2 harness
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'opencode-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_CURRENT }}

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run the OpenCode V2 Docker suites
        env:
          WORKIT_V2_HARNESS: "1"
        run: >
          bun test ./test/opencode-v2/contract.test.ts
          ./test/opencode-v2/lifecycle.test.ts ./test/opencode-v2/matrix.test.ts
