name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # GitHub Release
  issues: write # semantic-release success comments
  pull-requests: write # semantic-release success comments
  # ponytail: no id-token — OIDC trusted publishing needs a per-package trusted
  # publisher configured in npm; until then NPM_TOKEN is the auth path.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # AR-01/CA-33: a clean checkout tracks no adapter dist/, so the adapters
      # must be built here — before the gate and before any publish path runs.
      - name: Build adapters
        run: bun run build

      # AR-01/CA-33: the pack-only candidate gate (no registry, tag, or
      # marketplace op) must pass before semantic-release can publish.
      - name: Verify release candidate
        run: bun run verify:release-candidate

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPMJS }}
          # setup-node writes //registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}
          # into the temp .npmrc — without this var the token is an empty
          # placeholder that wins over NPM_TOKEN. NPM_TOKEN alone is not read
          # by npm when a userconfig exists.
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS }}

      # AR-15: semantic-release bumps versions only inside this ephemeral
      # checkout, so without a commit-back the repo manifests stay frozen while
      # tags march on (the 0.4.0-vs-v0.8.x drift). Sync every tracked manifest
      # to the newest v* tag and push with [skip ci] — a no-op on reruns.
      - name: Sync release manifests to main
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun packages/workit-core/scripts/sync-release-manifests.ts
          if [[ -n "$(git status --porcelain -- package.json 'packages/*/package.json' 'packages/workit-cursor/.cursor-plugin/plugin.json')" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git add package.json 'packages/*/package.json' 'packages/workit-cursor/.cursor-plugin/plugin.json'
            git commit -m "chore(release): sync manifests to latest tag [skip ci]"
            git push origin HEAD:main
          else
            echo "manifests already match the latest tag"
          fi
