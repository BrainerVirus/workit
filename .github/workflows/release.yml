name: Release

# Called from ci.yml after every CI job passed for the same main commit, so a
# red commit can never publish.
on:
  workflow_call:
    secrets:
      NPMJS:
        required: true

permissions: {}

# A release never writes back to main (AR-15, W2.34). semantic-release sets the
# version inside this ephemeral checkout only: the @semantic-release/npm
# bumpers write it into every package.json, the prepare-time
# rewrite-workspace-deps.ts mirrors it into the host plugin.json files and the
# ^<version> internal ranges, and publish-changed-packages.ts refuses to
# publish unless all of them equal the tag at HEAD. The committed manifests on
# main keep their last-synced version, which nothing compares to the tag, so a
# release adds no commit to main and leaves open PRs up to date.
jobs:
  release:
    runs-on: ubuntu-latest
    # Two quick merges must not race on tags.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # GitHub Release
      issues: write # semantic-release success comments
      pull-requests: write # semantic-release success comments
      id-token: write # npm provenance attestation (NPM_TOKEN stays the auth path)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # AR-01/CA-33: a clean checkout tracks no adapter dist/, so the adapters
      # must be built here — before the gate and before any publish path runs.
      - name: Build adapters
        run: bun run build

      # AR-01/CA-33: the pack-only candidate gate (no registry, tag, or
      # marketplace op) must pass before semantic-release can publish.
      - name: Verify release candidate
        run: bun run verify:release-candidate

      # semantic-release is the pinned devDependency from bun.lock, not a
      # version resolved from the registry at run time.
      - name: Release
        run: bun run release
        env:
          # npm publish (publish-changed-packages.ts) attaches a provenance
          # attestation via the job's OIDC token; auth is still NPM_TOKEN.
          NPM_CONFIG_PROVENANCE: "true"
          # @semantic-release/npm bumps each package with `npm version`, which
          # in a workspace reinstalls it. After the verify-time rewrite the
          # adapters ask for ^<previous version>; on a major bump the
          # workspace no longer satisfies that, so npm installs the previous
          # release into packages/*/node_modules/@brainervirus and the
          # prepare-time build bundles it (8.0.0 shipped 7.7.0's core).
          NPM_CONFIG_WORKSPACES_UPDATE: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPMJS }}
          # setup-node writes //registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}
          # into the temp .npmrc — without this var the token is an empty
          # placeholder that wins over NPM_TOKEN. NPM_TOKEN alone is not read
          # by npm when a userconfig exists.
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS }}
