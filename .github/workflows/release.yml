name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPMJS }}

      - name: Verify workspace:* rewritten before publish
        run: |
          set -euo pipefail
          if grep -q 'workspace:\*' packages/workit-opencode/package.json packages/workit-cursor/package.json packages/workit-cli/package.json; then
            echo "workspace:* leaked — platform packages published without @brainervirus/workit-core" >&2
            exit 1
          fi
