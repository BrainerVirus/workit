name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # GitHub Release
  issues: write # semantic-release success comments
  pull-requests: write # semantic-release success comments
  # ponytail: no id-token — OIDC trusted publishing needs a per-package trusted
  # publisher configured in npm; until then NPM_TOKEN is the auth path.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # AR-01/CA-33: a clean checkout tracks no adapter dist/, so the adapters
      # must be built here — before the gate and before any publish path runs.
      - name: Build adapters
        run: bun run build

      # AR-01/CA-33: the pack-only candidate gate (no registry, tag, or
      # marketplace op) must pass before semantic-release can publish.
      - name: Verify release candidate
        run: bun run verify:release-candidate

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPMJS }}
          # setup-node writes //registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}
          # into the temp .npmrc — without this var the token is an empty
          # placeholder that wins over NPM_TOKEN. NPM_TOKEN alone is not read
          # by npm when a userconfig exists.
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS }}

      # AR-15: semantic-release bumps versions only inside this ephemeral
      # checkout, so without a commit-back the repo manifests stay frozen while
      # tags march on (the 0.4.0-vs-v0.8.x drift). main is protected, so the
      # sync lands through an auto-merged PR instead of a direct push. Any
      # dirty tracked manifest before the sync is semantic-release's transient
      # workspace-dep rewrite (AR-02: those writes must never reach the repo)
      # and is discarded first — the commit then carries version fields only.
      - name: Sync release manifests to main
        if: success()
        env:
          # A GITHUB_TOKEN-opened PR never triggers workflow runs, so the
          # required status checks would stay pending and auto-merge would
          # hang forever (GitHub's actions/events limitation). The sync PR is
          # therefore opened with a dedicated PAT when one exists — PAT events
          # run CI normally. Falls back to GITHUB_TOKEN (create the PR; a
          # human or the Actions "allow creating pull requests" policy plus a
          # checks-triggering runner must then finish it).
          GH_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          MANIFESTS=(package.json 'packages/*/package.json' 'packages/workit-cursor/.cursor-plugin/plugin.json')
          git checkout -- "${MANIFESTS[@]}" 2>/dev/null || true
          bun packages/workit-core/scripts/sync-release-manifests.ts
          if [[ -z "$(git status --porcelain -- "${MANIFESTS[@]}")" ]]; then
            echo "manifests already match the latest tag"
            exit 0
          fi
          VERSION=$(node -p "require('./packages/workit-core/package.json').version")
          BRANCH="chore/manifest-sync-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -b "${BRANCH}"
          git add "${MANIFESTS[@]}"
          git commit -m "chore(release): sync manifests to v${VERSION}"
          git push -u origin "${BRANCH}"
          gh pr create \
            --title "chore(release): sync manifests to v${VERSION}" \
            --body "Automated post-release manifest alignment (AR-15). Sets every tracked manifest to the released ${VERSION}." \
            --base main --head "${BRANCH}"
          # Required checks gate the merge; if auto-merge is unavailable the
          # PR stays open for manual merge — the release itself already
          # succeeded, so this is bookkeeping, not a release failure.
          gh pr merge --auto --squash --delete-branch || echo "auto-merge unavailable — merge https://github.com/${GITHUB_REPOSITORY}/pull/$(gh pr view ${BRANCH} --json number -q .number) manually"
