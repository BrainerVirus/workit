name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  # ponytail: no id-token — OIDC trusted publishing needs a per-package trusted
  # publisher configured in npm; until then NPM_TOKEN is the auth path.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPMJS }}
          # setup-node writes //registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}
          # into the temp .npmrc — without this var the token is an empty
          # placeholder that wins over NPM_TOKEN. NPM_TOKEN alone is not read
          # by npm when a userconfig exists.
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS }}

      - name: Verify workspace:* rewritten before publish
        run: |
          set -euo pipefail
          if grep -q 'workspace:\*' packages/workit-opencode/package.json packages/workit-cursor/package.json packages/workit-cli/package.json; then
            echo "workspace:* leaked — platform packages published without @brainervirus/workit-core" >&2
            exit 1
          fi
