name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  id-token: write

jobs:
  # BLOCKING (required check in branch protection): reviews every PR on open/update.
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20
          persist-credentials: true # el action hace git fetch del PR — necesita auth

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps (cached by bun)
        run: bun install --frozen-lockfile

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4-flash
          use_github_token: true
          prompt: |
            Review this pull request's diff (read the changed files; run bun run check
            if needed to verify claims). Report:
            - Correctness bugs (logic, races, security)
            - Stale references or broken resolution introduced by renames/moves
            - Deviations from the repo contract (spec/plan in docs/<slug>/, Conventional
              Commits, no python3 in scripts, tests grouped by package under test/)
            - Missing or weak tests for new behavior
            Keep it focused: findings only, no praise. If clean, say so in one line.

  # ADVISORY (on-demand, never blocks merge): /oc or /opencode mention in a comment
  # (issue, PR thread, or a specific line in the Files tab) drives fix/explain/update.
  oc:
    if: |
      github.event_name != 'pull_request' &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true # el action hace git fetch del PR — necesita auth

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # required: add OPENCODE_API_KEY in repo secrets (opencode-go provider)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4-flash
          use_github_token: true

  # ADVISORY (never blocks merge): triage new issues with guidance, no commentary spam.
  triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true # el action hace git fetch del PR — necesita auth

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # required: add OPENCODE_API_KEY in repo secrets (opencode-go provider)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4-flash
          use_github_token: true
          prompt: |
            Review this issue. If there's a clear fix or relevant docs:
            - Provide documentation links
            - Add error handling guidance for code examples
            Otherwise, do not comment.
